format = 1
id = "replayed_or_stale_result"
group = "required"
title = "Повтор результата или старый ответ"
summary = "Одно и то же обновление Telegram приходит дважды, один и тот же ответ модели приходит дважды, затем приходит ответ, устаревший по версии состояния. Первый применяется ровно один раз, остальные не меняют состояние."
requirements = ["R-183", "R-108", "R-162", "R-107"]
plan_row = 15
plan_title = "Повтор результата или старый ответ"
plan_expected = "Изменение не применяется дважды"
failure = "Один request_id породил два применённых перехода; ответ со старой версией состояния принят; повторная доставка того же обновления создала второй опыт; устаревший ответ не отмечен как устаревший."

[[step]]
id = "start"
kind = "session"
action = "start"

[[step]]
id = "ask"
kind = "input"
sender = "operator"
text = "Запомни, пожалуйста: я люблю чай с мятой."
deliveries = 2

[[step]]
id = "same_answer_twice"
kind = "model"
proposal = "memory_write"
delivery = "twice"
content = "Записать: оператор любит чай с мятой (со слов оператора)."

[[step]]
id = "decide_once"
kind = "decide"
situation = "Ответ модели доставлен дважды с одним request_id."

[[step]]
id = "late_answer"
kind = "model"
proposal = "memory_write"
delivery = "stale"
content = "Записать другое: оператор любит кофе (ответ на запрос прежней версии состояния)."

[[assert]]
id = "duplicate_delivery_one_input"
kind = "event"
type = "input.arrived"
where = { external_id = "ask" }
count = 1
explain = "Одно обновление, доставленное дважды, даёт один входящий элемент (ключ rx:…)."

[[assert]]
id = "duplicate_delivery_one_statement"
kind = "event"
type = "memory.recorded"
where = { claim_kind = "statement_made" }
count = 1
explain = "Повторная доставка не создала второго опыта."

[[assert]]
id = "applied_once"
kind = "event"
type = "proposal.accepted"
where = { request_id = "same_answer_twice" }
count = 1
explain = "Дважды пришедший ответ применён один раз."

[[assert]]
id = "one_tea_record"
kind = "event"
type = "memory.recorded"
where = { text = "~чай с мятой", kind = "semantic" }
count = 1
explain = "Запись о чае создана один раз."

[[assert]]
id = "stale_marked"
kind = "event"
type = "proposal.stale"
where = { request_id = "late_answer" }
count = 1
explain = "Именно запоздалый ответ отмечен как устаревший (а не дубликат)."

[[assert]]
id = "stale_not_applied"
kind = "text"
marker = "любит кофе"
scope = "state"
presence = "absent"
explain = "Содержимое устаревшего ответа не попало в состояние."
