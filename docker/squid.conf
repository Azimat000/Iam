# Посредник для исходящих соединений исполнителя (S08, R-115): разрешены только перечисленные адреса.
# Исполнитель идёт на него по HTTPS_PROXY (метод CONNECT, содержимое не расшифровывается).
http_port 3128

acl sandbox_net src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
acl ssl_ports port 443
acl CONNECT method CONNECT

# Единственные адреса, нужные Claude Code при входе по долгоживущему токену подписки (документация,
# «Network access requirements»): API и обновление OAuth. Всё остальное — отказ. Если живая проверка (G11) покажет,
# что platform.claude.com не нужен при токене, строку ниже убрать.
acl allowed_hosts dstdomain api.anthropic.com platform.claude.com

http_access deny !sandbox_net
http_access deny CONNECT !ssl_ports
http_access allow CONNECT allowed_hosts
http_access deny all

# Ничего не кэшируем и тела не пишем; журнал доступа — только адреса.
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/null
pid_filename none
via off
forwarded_for delete
