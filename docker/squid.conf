# Subscription backend and authentication; exact hosts only, no wildcard.
http_port 3128
acl sandbox_net src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
acl ssl_ports port 443
acl CONNECT method CONNECT
acl allowed_hosts dstdomain chatgpt.com auth.openai.com api.openai.com
http_access deny !sandbox_net
http_access deny CONNECT !ssl_ports
http_access allow CONNECT allowed_hosts
http_access deny all
cache deny all
# No request paths, credentials, or response bodies in persistent logs.
access_log none
cache_log /dev/null
pid_filename none
via off
forwarded_for delete
